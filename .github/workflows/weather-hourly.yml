name: Weather Hourly
on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect
        run: curl -fSs --retry 3 https://topv51.vercel.app/api/weather-hourly
