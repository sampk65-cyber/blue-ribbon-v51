const COL="fbrfA_data", PREFIX="fbrfA_", ZONES=["一期","二期","三期","四南","四北"], G=["A","B","D","NG"];

const docId=(zone,year)=>`${PREFIX}priv__yieldArchive:${zone}:${year}`;
async function loadArchive(db,zone,year){
  const snap=await db.collection(COL).doc(docId(zone,year)).get();
  if(!snap.exists) return null;
  if(year==="2021") RAW[zone]=snap.data();
  try{return JSON.parse(snap.data().value)||{};}catch(e){return {};}
}
function dupCount(rec){ // 同一天、同一品級中完全相同的條目
  let n=0;
  for(const q of G){ const seen={}; (rec&&rec[q]||[]).forEach(e=>{const k=JSON.stringify(e); if(seen[k]) n++; seen[k]=1;}); }
  return n;
}

// ② 修正規則（以 Excel 為準，只處理不一致的日期與品級）：
//   a. 先移除「完全相同的重複條目」，若加總因此等於 Excel，就用去重後的清單（保留原本每筆明細）。
//   b. 仍不相等時，改為 1 筆校正條目＝Excel 數值（沿用該日原有條目的欄位格式，標記 corrected2021）。
//   c. Excel 為 0 → 清空該品級。
const EX_IDX={A:0,B:1,D:2,NG:3};
function dedupe(list){ const seen={}; return (list||[]).filter(e=>{const k=JSON.stringify(e); if(seen[k]) return false; seen[k]=1; return true;}); }
function buildPlan(){
  const plan={}; let html='<div class="card"><b>② 修正預覽（尚未寫入）</b><table><tr><th>分區</th><th>日期</th><th>品級</th><th>資料庫</th><th>→ 修正後</th><th>方式</th></tr>';
  let n=0;
  for(const z of ZONES){
    const arch=ARCH[z]; if(!arch) continue; const ex=EXCEL[z]||{};
    const next=JSON.parse(JSON.stringify(arch)); let changed=false;
    const days=[...new Set([...Object.keys(ex),...Object.keys(arch).filter(d=>d.startsWith("2021-"))])].sort();
    for(const d of days){
      const e=ex[d]||[0,0,0,0]; const rec=next[d]||{}; let dayChanged=false;
      for(const q of G){
        const want=e[EX_IDX[q]]; const cur=rec[q]||[]; const have=sumList(cur);
        if(Math.abs(have-want)<=0.05) continue;
        let how, nl;
        const dd=dedupe(cur);
        if(dd.length<cur.length && Math.abs(sumList(dd)-want)<=0.05){ nl=dd; how=`移除重複 ${cur.length-dd.length} 筆`; }
        else if(want<=0){ nl=[]; how='清空（Excel 為 0）'; }
        else { const tpl=(cur[0]||Object.values(rec).flat().find(x=>x&&typeof x==='object')||{}); nl=[{...JSON.parse(JSON.stringify(tpl)), net:Math.round(want*100)/100, corrected2021:true}]; how='改為 Excel 數值'; }
        rec[q]=nl; dayChanged=true; n++;
        html+=`<tr><td>${z}</td><td>${d}</td><td>${q}</td><td>${r1(have)}</td><td class="ok">${r1(sumList(nl))}</td><td>${how}</td></tr>`;
      }
      if(dayChanged){ next[d]=rec; changed=true; }
    }
    if(changed) plan[z]=next;
  }
  html+=`</table><div class="note">共 ${n} 個「日期×品級」需要修正，涉及分區：${Object.keys(plan).join('、')||'無'}。</div></div>`;
  return {plan,html,n};
}
document.getElementById('plan').onclick=()=>{
  PLAN=buildPlan();
  document.getElementById('out').insertAdjacentHTML('afterbegin',PLAN.html);
  document.getElementById('write').disabled=!PLAN.n; document.getElementById('bk').disabled=false;
  window.scrollTo(0,0);
};

      log(`${z}：已寫入修正`);
      // 驗證
      const snap=await DB.collection(COL).doc(docId(z,"2021")).get();
      const chk=JSON.parse(snap.data().value)||{}; const ex=EXCEL[z]||{}; let bad=0;
      const days=[...new Set([...Object.keys(ex),...Object.keys(chk).filter(d=>d.startsWith("2021-"))])];
      for(const d of days){ const e=ex[d]||[0,0,0,0]; const rec=chk[d]||{}; if(G.some(q=>Math.abs(sumList(rec[q])-e[EX_IDX[q]])>0.05)) bad++; }
      log(bad?`<span class="bad">${z}：驗證仍有 ${bad} 天不一致</span>`:`<span class="ok">${z}：驗證通過，與 Excel 逐日一致</span>`);
    }catch(e){ log(`<span class="bad">${z}：寫入失敗（${e.message||e}），此分區資料未變更</span>`); }
  }
  log('完成。請重新整理功能3／表八，確認 2021 年數字。');
};

document.getElementById('csv').onclick=()=>{
  const head=['分區','日期','A_Excel','B_Excel','D_Excel','其他_Excel','A_庫','B_庫','D_庫','NG_庫','良品差','重複條目數'];
  const csv='\ufeff'+[head,...diffRows].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='2021產能差異.csv'; a.click();
